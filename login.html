<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Bahrain Rental Management</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="login-screen">
  <div class="login-card">
    <h1>Bahrain<span>Rental</span></h1>
    <p class="subtitle">Sign in to continue</p>
    <form id="loginForm">
      <input type="text" id="loginUser" placeholder="Username" required>
      <div class="password-field">
        <input type="password" id="loginPass" placeholder="Password" required>
        <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">👁</button>
      </div>
      <button type="submit" class="btn btn-primary">Sign In</button>
      <p class="login-error" id="loginError" hidden>Invalid username or password.</p>
    </form>
  </div>
</section>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="users.js"></script>
<script src="login.js"></script>
</body>
</html>
